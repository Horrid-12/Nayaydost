<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NyayaDost — Something needs attention</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="error-page">
  <main class="error-shell">
    <a class="brand error-brand" href="/" aria-label="NyayaDost home">
      <span class="brand-seal" aria-hidden="true">⚖</span>
      <span class="brand-text">
        <span class="brand-name">NyayaDost</span>
        <span class="brand-native">न्यायदोस्त</span>
      </span>
    </a>

    <section class="error-card" aria-labelledby="error-title">
      <p class="error-status">{{STATUS}}</p>
      <p class="eyebrow"><span class="eyebrow-rule" aria-hidden="true"></span> A small interruption</p>
      <h1 id="error-title">{{TITLE}}</h1>
      <p class="error-message">{{MESSAGE}}</p>
      <p class="error-hint">{{HINT}}</p>
      <div class="error-actions">
        <a class="button primary" href="/">Return to NyayaDost</a>
        <a class="button ghost" href="#legal-aid">Find free legal help</a>
      </div>
      <p class="error-meta">Request ID: <span>{{REQUEST_ID}}</span></p>
    </section>

    <p class="error-footer">
      If this keeps happening, call the free NALSA legal aid helpline at <strong>15100</strong>.
      NyayaDost does not store your document.
    </p>
  </main>
</body>
</html>
